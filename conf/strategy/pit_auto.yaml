# Come pit_duccio, ma N viene dal probe onnxruntime (stage=probe) per la board e la precisione
# della config, qualunque sia il backend: per esempio
#   python run.py stage=search strategy=pit_auto hardware=rpi5 quantization=int8
# Su CPU si usa l'N misurato su un solo core (n_source: cpu_1), il caso peggiore.
# Se il probe manca, la ricerca lo lancia da sola e poi riparte.
name: pit_auto
method: pit
n_source: cpu_1
probe:
  backend: onnxruntime    # N sempre dal probe onnxruntime, per ogni backend di export
  stage: null             # preset di conf/stage/; null -> probe_edge su CPU delle board, probe altrove
  freq_target: null       # null -> quello della config se la board lo dichiara, altrimenti il primo

search:
  epochs: 30
  batch: 16
  optimizer: SGD
  lr0: 0.001
  lrf: 0.01
  warmup_epochs: 0
  seed: 42
  pit:
    n: auto
    remainder: true
    warmup_epochs: 0
    ema: false
  nas:
    optimizer: AdamW
    lr0: 0.01
    lrf: 1.0
    cos_lr: false
    weight_decay: 0.0
  regularizer:
    mode: duccio
    target: {ops: 50%}
