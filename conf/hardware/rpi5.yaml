board: rpi5
arch: aarch64
os: raspbian12
cpu: cortex_a76
n_cores_total: 4
shared_clock_domain: true      # i 4 core condividono il clock
trt_available: false
axelera_available: false       # con la scheda Metis: hardware=rpi5_axelera
power_sensors: false
controller: rpi5

remote:
  host: rpi5
  workdir: /home/bench/bench
  python: /home/bench/bench/.venv/bin/python

provision:
  script: scripts/provision/rpi5.sh
  requirements: scripts/requirements/aarch64-rpi5.txt
  container: false

freq:
  max: {khz: 2400000, governor: performance}
  mid: {khz: 1500000, governor: userspace}
  low: {khz: 1000000, governor: userspace}

compute:                       # nessun requires_freq: i 4 core sono sempre online
  cpu_1: {device: cpu, n_cores: 1}
  cpu_2: {device: cpu, n_cores: 2}
  cpu_4: {device: cpu, n_cores: 4}

# Tetti da datasheet per il roofline (facoltativi, vedi docs/config/hardware.yaml).
# Stima da verificare: Cortex-A76 = 2 pipe NEON da 128 bit -> 8 MAC fp32 per ciclo per core
# (int8 con SDOT: 32), 2.4 GHz; LPDDR4X-4267 a 32 bit -> 17.1 GB/s. Togli il commento dopo
# aver controllato i numeri.
# peaks:
#   cpu_1: {gmacs: {fp32: 19.2, int8: 76.8}, bandwidth_gbs: 17.1}
#   cpu_4: {gmacs: {fp32: 76.8, int8: 307.2}, bandwidth_gbs: 17.1}
