board: wks4_rtx6000
arch: x86_64
os: ubuntu22
n_cores_total: 24
gpu: rtx6000_ada
trt_available: true
axelera_available: false
power_sensors: false
controller: x86
# nessuna chiave `remote`: esecuzione locale

freq:
  # Il ripristino non e' un'opzione: `tuned()` rimette lo stato com'era in ogni
  # caso, anche quando la misura solleva.
  default: {governor: performance}

compute:
  gpu: {device: cuda}
  cpu_1: {device: cpu, n_cores: 1}
  cpu_2: {device: cpu, n_cores: 2}
  cpu_4: {device: cpu, n_cores: 4}
  cpu_8: {device: cpu, n_cores: 8}
  cpu_16: {device: cpu, n_cores: 16}
  cpu_all: {device: cpu, n_cores: 24}

