name: int8
precision: int8
method: ptq

calibration:
  n_samples: 512          # Axelera: 100-400, oltre non porta benefici
  source: calib
  shuffle_seed: 42        # FISSO: calibration set identico per ogni artefatto
  cache: true

validation:
  max_abs_diff: 0.05             # testa one-to-many: tensori grezzi
  min_match_rate: 0.90           # testa one-to-one: detection accoppiate
  max_score_diff: 0.10
  map50_drop_tolerance: 0.02

backend_args:
  tensorrt: ["--int8"]
  onnxruntime:
    calibration_method: minmax
    calibration_options: {CalibMovingAverage: true, CalibMovingAverageConstant: 0.01}   # media mobile: experiments/quantization/calibration
    # solo i nodi con pesi, come Ultralytics: la coda della testa in int8 (box 0-640 e
    # score 0-1 con una sola scala) porta tutti gli score a 0
    quantize_op_types: [Conv, Gemm, MatMul]
  openvino: {preset: performance}
