# Come int8_full, con calibrazione Entropy (KL). Con quantize_static di onnxruntime usa 128 bin e
# 128 bin quantizzati (non modificabili): una sola soglia candidata, scale identiche a MinMax.
# int8_full: come int8, ma per i backend QDQ (onnxruntime, openvino_qdq) quantizza tutti i tipi di nodo:
# SiLU, Add, Concat, Resize, MaxPool restano in int8 tra una conv e l'altra, senza
# Dequantize/Quantize attorno a ognuna. In float: la Softmax dell'attention e la coda della
# testa (decode, ultima conv di box e score, sigmoide finale, TopK), che in int8 porta gli
# score a 0. Il resto dei rami cv2/cv3 della testa e' quantizzato.
name: int8_full_entropy
precision: int8
method: ptq

calibration:
  n_samples: 512          # Axelera: 100-400, oltre non porta benefici
  source: calib
  shuffle_seed: 42        # FISSO: calibration set identico per ogni artefatto
  cache: true

validation:
  max_abs_diff: 0.05             # testa one-to-many: tensori grezzi
  min_match_rate: 0.90           # testa one-to-one: detection accoppiate
  max_score_diff: 0.10
  map50_drop_tolerance: 0.02

backend_args:
  tensorrt: ["--int8"]
  onnxruntime:
    quant_format: QDQ
    per_channel: true
    reduce_range: false
    calibration_method: entropy
    quantize_op_types: null                 # tutti i tipi
    quantize_exclude_op_types: [Softmax]
    # nodi della testa (layer 23, /model.23/ con Ultralytics, /net/layers.23/ col modello
    # potato) fuori dai primi due blocchi dei rami one2one_cv2/cv3
    quantize_exclude_regex: ['^/(model|net/layers)\.23/(?!one2one_cv[23]\.\d+/one2one_cv[23]\.\d+\.[01]/)']
  openvino: {preset: performance}
