# TensorRT con calibrazione implicita, come Ultralytics su TensorRT 10: ONNX FP32, scale
# calcolate da TensorRT (calibratore MinMax sulle stesse immagini di calibrazione degli altri
# INT8, eseguito sulla workstation) e precisione scelta layer per layer fra INT8 e FP16.
# Solo int8: fp32 e fp16 sarebbero identici a backend=tensorrt.
name: tensorrt_implicit
precisions: [int8]
export_format: engine
supports_gpu: true
supports_cpu: false
requires:
  trt: true
  arch: [x86_64, aarch64]

build:
  on_target: true
  from_format: onnx
  opset: 17                    # ONNX intermedio da cui trtexec builda l'engine
  workspace_mb: 4096
  timeout_s: 1800

# INT8 implicito: niente QDQ nell'ONNX, le scale le calcola TensorRT.
int8:
  calibration: minmax          # minmax | entropy2 (algoritmo del calibratore di TensorRT)
  fp16: true                   # TensorRT puo' scegliere FP16 dove INT8 non conviene (--fp16)
  head_fp32: true              # Sigmoid della testa in FP32, conv finali della testa e DFL in
                               # FP16, come Ultralytics (score calibrati, issue #24668)

benchmark:
  tool: trtexec
  # --noDataTransfers=false e' obbligatorio: al default trtexec esclude i
  # trasferimenti host<->device e il tempo non e' confrontabile con perf_test.
  cmd: >
    trtexec --loadEngine={engine}
            --iterations={iters} --warmUp={warmup_ms}
            --avgRuns={iters} --duration=0
            --useSpinWait --noDataTransfers=false
  iters: 200
  warmup_ms: 2000
  parse: trtexec
  scope: end_to_end_with_transfers
  metrics: [mean_ms, median_ms, p90_ms, p99_ms, gpu_compute_ms, throughput_qps]
