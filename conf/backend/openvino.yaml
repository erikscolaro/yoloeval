name: openvino
export_format: openvino
supports_gpu: false
requires:
  arch: [x86_64, aarch64]     # su aarch64: plugin CPU ARM (Pi 5, Jetson)

build:
  on_target: false
  from_format: onnx

benchmark:
  tool: benchmark_app
  cmd: >
    benchmark_app
      -m {model}
      -d {device}
      -b 1
      -hint none
      -nstreams 1
      -niter {iters}
      -nthreads {threads}
      -report_type no_counters
  iters: 200
  warmup_iters: 50
  # Precisione di calcolo per precisione dell'artefatto (-infer_precision). Senza, sulle CPU ARM con
  # fp16 (Pi 5) OpenVINO calcola in fp16 anche l'IR fp32. Per l'int8 vale per i layer non quantizzati:
  # f32 come in onnxruntime su x86; su aarch64 f16, perche' con f32 il plugin ARM manda le conv
  # quantizzate nei kernel di riferimento (pico NNCF sul Pi: 2032 ms in f32 contro 41 in f16).
  infer_precision: {fp32: f32, fp16: f16, int8: {x86_64: f32, aarch64: f16}}
  parse: benchmark_app
  scope: end_to_end_with_transfers
  metrics: [mean_ms, median_ms, p90_ms, p99_ms, throughput_qps]
