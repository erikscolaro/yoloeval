name: tensorrt
export_format: engine
supports_gpu: true
supports_cpu: false
requires:
  trt: true
  arch: [x86_64, aarch64]

build:
  on_target: true
  from_format: onnx
  opset: 17                    # ONNX intermedio da cui trtexec builda l'engine
  workspace_mb: 4096
  timeout_s: 1800

# INT8 esplicito: lo stesso ONNX QDQ di onnxruntime e openvino_qdq (nodi e calibrazione dalla
# conf di quantizzazione), con i bias in float.
int8:
  fp16: true                   # i layer non quantizzati in FP16 invece che FP32 (--fp16)

benchmark:
  tool: trtexec
  # Niente --noDataTransfers: al default trtexec misura i trasferimenti host<->device (H2D e
  # D2H dentro la riga Latency). Il flag e' booleano e trtexec ignora il valore: anche
  # --noDataTransfers=false li esclude (H2D Latency 0 ms negli output del 30/9).
  cmd: >
    trtexec --loadEngine={engine}
            --iterations={iters} --warmUp={warmup_ms}
            --avgRuns={iters} --duration=0
            --useSpinWait
  iters: 200
  warmup_ms: 2000
  parse: trtexec
  scope: end_to_end_with_transfers
  metrics: [mean_ms, median_ms, p90_ms, p99_ms, gpu_compute_ms, throughput_qps]
