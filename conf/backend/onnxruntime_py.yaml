# Opzionale: misura l'overhead del binding Python come risultato a se'.
name: onnxruntime_py
export_format: onnx
supports_gpu: true
requires:
  arch: [x86_64, aarch64]

build:
  on_target: false
  opset: 17

benchmark:
  tool: python_timer           # timer interno, UNICA ECCEZIONE alla regola
  iters: 200
  warmup_iters: 50
  parse: python_timer
  scope: end_to_end_with_transfers
  metrics: [mean_ms, median_ms, p90_ms, p99_ms]
