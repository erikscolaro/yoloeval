# @package _global_
# Profilo di deploy (NEW_MASTERPLAN 2d): le condizioni di misura del dispositivo, il budget e la LUT misurata in
# quelle condizioni. Con target=rpi5_640 si fissano tutte insieme; per un altro dispositivo o un'altra risoluzione
# si aggiunge un file. Lo leggono stage=select e strategy=pit_latency.
defaults:
  - override /hardware: rpi5
  - override /deploy: "640"
  - override /backend: openvino
  - override /quantization: fp16

freq_target: max
compute_target: cpu_4

target:
  name: rpi5_640
  fps: 30                 # richiesta dell'applicazione: da qui si calcola tutto il resto
  budget_ms: ${ms_per_fps:${.fps}}   # end-to-end, 1000 / fps: dal fotogramma uint8 ai box finali
  pre_ms: 1.8             # pre-processing (uint8 -> float, /255, layout). PROVVISORIO: Ultralytics sul Pi, 21/09/2026
                          #   (tests/fixtures/ultralytics_speed_only.txt); da sostituire con experiments/latenza/pre_post_rpi5
  post_ms: 0.9            # post-processing fuori dal grafo. PROVVISORIO, stessa fonte; con la one-to-one decodifica e TopK
                          #   sono nel grafo e il resto (soglia, scala dei box) costa ~0,01 ms: 0,9 e' prudente
  model_budget_ms: ${meno:${.budget_ms},${.pre_ms},${.post_ms}}   # budget del modello = budget - pre - post: lo usano
                          #   select e pit_latency; si puo' anche scrivere a mano
  floor_ratio: 0.85       # test del pavimento: pavimento <= 85 % di B
  tie: 0.01               # pari merito fra ottimo e tetto: 1 punto di mAP50-95 (criterio della tesi)
  seed_noise: 0.004       # pari merito fra le partenze: deviazione standard della mAP50-95 di P su 5 seed
  start_model: null       # scelta manuale, es. w0.25_D126; null = sceglie la regola
  start_reason: null      # obbligatorio con start_model
  lut_dir: artifacts/lut/rpi5   # relativo alla root; scripts/build_lut.sh lo produce
  latency_csv: null       # csv (arch, ms) delle reti intere misurate a 640, oltre a B4-R e pavimento_s
