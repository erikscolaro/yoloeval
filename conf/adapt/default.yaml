# Adattamento al dataset di destinazione (Svanstrom) dei pesi di stage=train, per ogni modello,
# prima del pruning. Ricetta di partenza: finetune/musgd (la migliore dell'ablation sul
# fine-tuning dei potati), poi scelta con le ablation di experiments/adapt (lr, optimizer, imgsz):
# MuSGD lr0 1e-4, mosaic 1.0, warmup 2, 40 epoche (patience 15), rete intera, imgsz 640.
# I nomi coincidono con gli argomenti di model.train() di Ultralytics.
epochs: 40
batch: 64
workers: 12
optimizer: MuSGD
lr0: 0.0001             # ablation experiments/adapt/lr: lr piu' basso = picco piu' alto
lrf: 0.01
cos_lr: false
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 2
patience: 10
close_mosaic: 0
seed: 42
# augmentation: mosaic acceso (scale 0: gli oggetti restano alla loro dimensione), il resto dai valori ufficiali di yolo26n
mosaic: 1.0
mixup: 0.012
copy_paste: 0.075       # in Ultralytics agisce solo con segmenti: inerte sul detect
scale: 0 #.562            # disabilitato, gli oggetti sono già minuscoli.
fliplr: 0.606
degrees: 1.11
shear: 1.46
translate: 0.071
hsv_h: 0.014
hsv_s: 0.645
hsv_v: 0.566
bgr: 0.106
