# Adattamento al dataset di destinazione (Svanstrom) dei pesi di stage=train, per ogni modello,
# prima del pruning. Ricetta di partenza: finetune/musgd (la migliore dell'ablation sul
# fine-tuning dei potati), da rivedere con un'ablation dedicata (experiments/adapt).
# I nomi coincidono con gli argomenti di model.train() di Ultralytics.
epochs: 100
batch: 64
workers: 12
optimizer: MuSGD
lr0: 0.005              # come i pesi ufficiali di yolo26n
lrf: 0.01
cos_lr: false
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 0
patience: 100
close_mosaic: 25
seed: 42
mosaic: 1.0
mixup: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
