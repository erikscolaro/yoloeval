# Training da zero di yolo26p con MuSGD a 1024px, 250 epoche e close_mosaic 25: ablation sulla
# risoluzione di training (experiments/ablation/train/imgsz). Come scratch_musgd tranne imgsz e
# close_mosaic.
# Identica a scratch_{adam,musgd,sgd}.yaml tranne optimizer e lr0; il resto come i default di
# Ultralytics. I nomi delle chiavi coincidono 1:1 con gli argomenti di model.train().
epochs: 250
batch: 64
workers: 12
cache: disk             # fuori dalle chiavi: cambia solo come si caricano i dati
imgsz: 1024
optimizer: MuSGD
lr0: 0.01               # quello scelto da optimizer=auto di Ultralytics (MuSGD)
lrf: 0.01               # lr finale = lr0 * 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
patience: 250           # niente early stopping: curve complete da confrontare
close_mosaic: 25        # 10% delle epoche, come nella tesi (100 su 1000)
seed: 42
mosaic: 1.0
mixup: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
