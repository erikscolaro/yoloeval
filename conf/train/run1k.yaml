# yolo26p da zero su AOD4 a 1000 epoche (experiments/train/run1k): scratch_musgd con epoche, scheduler del coseno e
# close_mosaic al 10% come la run a 1000 epoche della tesi, senza early stopping. Il resto (MuSGD, batch 64, seed 42,
# scale 0.5 di default) come scratch_musgd. I nomi delle chiavi coincidono 1:1 con gli argomenti di model.train().
epochs: 1000
batch: 64
workers: 12
cache: disk             # fuori dalle chiavi: cambia solo come si caricano i dati
imgsz: 640
optimizer: MuSGD
lr0: 0.01               # quello scelto da optimizer=auto di Ultralytics (MuSGD)
lrf: 0.001              # come la tesi: lr finale = lr0 * 0.001
cos_lr: true            # come la tesi
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
patience: 1000          # niente early stopping
close_mosaic: 100       # 10% delle epoche, come la tesi
seed: 42
mosaic: 1.0
mixup: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
# Testa one-to-one (nms=False), come negli export e sul Pi: la validation del training sceglie best.pt sulla one-to-one.
nms: false
