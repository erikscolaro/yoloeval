# Ricetta unica di tutti i training della tesi (NEW_MASTERPLAN §2, training e seed): mai cambiata.
# I nomi delle chiavi coincidono 1:1 con gli argomenti di model.train() di Ultralytics.
epochs: 1000
patience: 200           # early stopping: rete di sicurezza per i modelli in overfitting
close_mosaic: 10        # i run fermati prima dall'early stopping non ci arrivano (limite dichiarato)
batch: 64               # secondo la GPU, lo stesso per tutti; fino a 64 (nbs) l'aggiornamento e' equivalente
workers: 12
imgsz: 640              # sempre 640: la risoluzione di deploy non si allena
optimizer: MuSGD
lr0: 0.01
lrf: 0.01               # lr finale 1e-4, decadimento lineare
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
seed: 0                 # 0, 1, 2 per i modelli dei confronti finali
mosaic: 1.0
mixup: 0.0
scale: 0.25             # zoom 0.75-1.25: con 0.5 un oggetto di 16 px scenderebbe a 8
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
# Testa one-to-one (nms=False), come negli export e sul Pi: la validation del training sceglie best.pt sulla one-to-one.
nms: false
