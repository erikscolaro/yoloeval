# Ricetta unica di tutti i training della tesi (NEW_MASTERPLAN §2, training e seed).
# Dal 28/10/2026 le augmentation di yolo26n piu' cutmix e degrado camera (pico 59d8534a, mAP50 0.842 contro 0.819 con
# degrees 5 e scale 0.25): i run prima non sono confrontabili.
# I nomi delle chiavi coincidono 1:1 con gli argomenti di model.train() di Ultralytics.
epochs: 300             # la ricetta dei modelli della griglia (_e300_); 1000 solo per i primi F (_e1000_)
patience: 200           # early stopping: rete di sicurezza per i modelli in overfitting
close_mosaic: 10        # i run fermati prima dall'early stopping non ci arrivano (limite dichiarato)
batch: 64               # secondo la GPU, lo stesso per tutti; fino a 64 (nbs) l'aggiornamento e' equivalente
workers: 12
imgsz: 640              # sempre 640: la risoluzione di deploy non si allena
optimizer: MuSGD
lr0: 0.01
lrf: 0.01               # lr finale 1e-4, decadimento lineare
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
seed: 0                 # 0, 1, 2 per i modelli dei confronti finali
mosaic: 0.90863
mixup: 0.01216
scale: 0.56232
# Augmentation geometriche e di colore: i valori di yolo26n.pt (train_args, COCO), tranne copy_paste che vuole i segmenti.
hsv_h: 0.01373
hsv_s: 0.64481
hsv_v: 0.56565
degrees: 1.11032
shear: 1.46386
translate: 0.07105
perspective: 0.00011
flipud: 0.05854
fliplr: 0.60571
bgr: 0.10567
cutmix: 0.1             # incolla una zona di un'altra immagine con i suoi box: il copy_paste vuole i segmenti
# Degrado della camera, con Albumentations (formato A.to_dict, Ultralytics lo ricostruisce con A.from_dict).
# Sostituisce la lista di default di Ultralytics (Blur, MedianBlur, ToGray, CLAHE a p=0.01). Kernel fino a 5 px:
# di piu' cancellerebbe gli uccelli da 8-16 px.
augmentations:
  - transform: {__class_fullname__: MotionBlur, blur_limit: [3, 5], p: 0.1}
  - transform: {__class_fullname__: GaussianBlur, blur_limit: [3, 5], p: 0.1}
  - transform: {__class_fullname__: GaussNoise, std_range: [0.02, 0.06], p: 0.1}
  - transform: {__class_fullname__: ImageCompression, quality_range: [50, 95], p: 0.2}
# Testa one-to-one (nms=False), come negli export e sul Pi: la validation del training sceglie best.pt sulla one-to-one.
nms: false
