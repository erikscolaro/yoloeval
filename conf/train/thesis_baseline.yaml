# Baseline su AOD4 della tesi (~/Desktop/thesis/runs/baseline-yolo26{n,s,m}): dai pesi COCO, 250
# epoche con patience 20, optimizer auto. Importate con scripts/import_thesis_baselines.py, non
# allenate da yoloeval. I nomi delle chiavi coincidono 1:1 con gli argomenti di model.train().
epochs: 250
patience: 20
batch: 64
workers: 8
imgsz: 640
cache: false
pretrained: true
optimizer: auto
seed: 0
deterministic: true
cos_lr: false
close_mosaic: 10
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
