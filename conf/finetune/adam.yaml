# Fine-tuning del modello potato con Adam, batch 64, lr da 1e-3 a 1e-5 lineare.
# I nomi coincidono con gli argomenti di model.train() di Ultralytics.
epochs: 100
batch: 64
workers: 12
optimizer: Adam
lr0: 0.001              # Adam vuole un lr ~10 volte piu' basso di SGD
lrf: 0.01
cos_lr: false
momentum: 0.937         # con Adam e' beta1
weight_decay: 0.0005
warmup_epochs: 0
patience: 100
close_mosaic: 25
seed: 42
mosaic: 1.0
mixup: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
