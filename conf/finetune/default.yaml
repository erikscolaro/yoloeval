# Fine-tuning del modello potato (PrunedTrainer di yolopit). I nomi coincidono con gli
# argomenti di model.train() di Ultralytics. Usato solo dalle strategie, non dalla baseline.
epochs: 50
batch: 16
optimizer: SGD
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 0
patience: 20
seed: 42
mosaic: 1.0
mixup: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
