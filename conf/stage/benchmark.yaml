name: benchmark

# Attesa termica prima di ogni cella. Condizionale: se la board e' gia'
# sotto soglia non aspetta.
thermal:
  threshold_c: 50          # il Pi a riposo sta a ~52 °C: si aspetta fino a timeout_s
  timeout_s: 300
  poll_s: 10

# Wrapping del comando di misura. chrt richiede privilegi: se non
# disponibili il comando viene eseguito senza, e il fatto e' registrato.
scheduling:
  rt_priority: 80         # chrt -f <n>; null per disabilitare
  drop_caches: true
  swap_off: true
