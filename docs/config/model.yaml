# Riferimento dei campi di conf/model/<nome>.yaml
# L'architettura e' YOLO26 con testa one-to-one, costruita da src/models.py (NEW_MASTERPLAN §4).

defaults: [yolo26, _self_]
  # Nelle taglie con nome (yolo26f, p, n, s, m): eredita da yolo26.yaml e cambia
  # solo nome e larghezza.

name: yolo26n_${.depth}
  # OBBLIGATORIO. Compare nei risultati, nell'export_key e nel nome delle
  # cartelle degli artefatti.

width: 0.25
  # OBBLIGATORIO. Una delle 9 larghezze della scala discreta:
  # 0.0625 0.09375 0.125 0.1875 0.25 0.375 0.5 0.75 1.0. Le altre non costruiscono
  # o duplicano un'architettura. Sopra 0.5 il tetto di canali e' 512.

depth: D126
  # OBBLIGATORIO. Numero di conv della rete: D101 (c3k=False in tutti i C3k2),
  # D126 (YAML ufficiale), D170 (moltiplicatore di profondita' 1.0). Controllato a
  # ogni costruzione.

nc: 4
  # Numero di classi. Deve coincidere con `dataset.nc`. Serve anche a
  # riconoscere la testa one-to-many dalla forma dell'output (4 + nc).
