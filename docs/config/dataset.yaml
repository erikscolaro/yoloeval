# Riferimento dei campi di conf/dataset/<nome>.yaml

name: aod4
  # OBBLIGATORIO. Compare nei nomi delle cartelle degli artefatti e decide
  # dove il dataset viene copiato sulla board: <workdir>/data/<name>/

local_path: ${project_root}/data/aod4
  # OBBLIGATORIO. Path assoluto sulla WORKSTATION, alla radice del dataset.
  # Da qui vengono: l'hash dei dati (lista ordinata dei file con le loro
  # dimensioni, salvata in .dataset_hash e RICALCOLATA a ogni chiamata) e
  # l'rsync verso le board.

yaml: ${.local_path}/dataset.yaml
  # OBBLIGATORIO. Path assoluto al data yaml in formato Ultralytics, quello
  # con path/train/val/names. Viene passato a model.train() e al calcolo
  # della mAP. Sulla board ne viene riscritta una copia con `path` corretto:
  # senza, Ultralytics validerebbe su una cartella vuota e riporterebbe mAP 0
  # senza lamentarsi.

nc: 4
  # Numero di classi. Deve coincidere con `model.nc`.

names: [airplane, bird, drone, helicopter]
  # Descrittivo qui: i nomi che contano sono quelli dentro il data yaml.
  # Averli anche qui serve a leggere il file senza aprirne un altro.

subset: all
  # Solo svanstrom: all | small | medium | large | background. `all` e'
  # tutto, background compreso; small/medium/large sono le immagini con
  # oggetti per fascia COCO del box piu' grande (sqrt(area) < 32, 32-96,
  # > 96 px); `background` solo i frame senza, da aggiungere a mano. Entra
  # in `name` e `local_path`, quindi ogni sottoinsieme ha artefatti e copia
  # sulla board suoi. Split identici fra sottoinsiemi: il dataset li
  # fa per video, per classe, bilanciando le fasce (repo air-detection).
