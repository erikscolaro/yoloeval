# Riferimento dei campi di conf/deploy/<nome>.yaml
# Il training e' sempre a 640 (train.imgsz); qui l'ingresso di export, mAP degli export,
# confronto numerico, calibrazione int8 e costi della ricerca PIT.

name: 480p
  # OBBLIGATORIO. Compare nell'export_key.

imgsz: [480, 864]
  # OBBLIGATORIO. [altezza, larghezza] dell'ingresso, multipli di 32.

batch: 1
  # FACOLTATIVO, default 1. Batch fisso dell'export OpenVINO e del benchmark (-b): N crop del tracker
  # (src/crop_tracker.py) in una sola inferenza. Solo con nomi propri (crop256_b2...), perche' il batch non
  # entra nell'export_key. Il confronto numerico da' le immagini al modello a gruppi di N.
