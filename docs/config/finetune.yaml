# Riferimento dei campi di conf/finetune/<nome>.yaml
#
# Fine-tuning del modello potato dalla ricerca (PrunedTrainer di yolopit), su
# `pretrain_dataset` come la ricerca; i suoi pesi vanno all'export. Usato solo dalle
# strategie con method: pit; la baseline lo ignora e il gruppo non entra nelle sue chiavi.
# I nomi coincidono con gli argomenti di model.train() di Ultralytics (vedi train.yaml): puoi
# aggiungere qualsiasi argomento accettato da Ultralytics.
#
# Quello che NON va messo qui: `data` (arriva da pretrain_dataset.yaml), `project` e `name` (li decide
# la cache). `imgsz`, se manca, e' train.imgsz.
#
# Ogni campo entra nella chiave del fine-tuning (finetune_key), tranne `workers` e
# `cache`, che non cambiano il risultato.

epochs: 50
batch: 64
workers: 12
  # Intero. Processi del dataloader. Fuori dal finetune_key.
optimizer: SGD
  # yolopit usa SGD di default: il modello parte gia' allenato.
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 0
patience: 20
close_mosaic: 25
  # Intero. Epoche finali senza mosaic augmentation (mosaic a 0).
cos_lr: false
  # true | false. Scheduler coseno del learning rate al posto di quello lineare.
seed: 42
nms: false
  # false | null. false: la validation durante il training usa la testa one-to-one (senza NMS), quindi
  # best.pt e' scelto sulla testa che va in deploy. null (default di Ultralytics 8.4): testa one-to-many con NMS.
mosaic: 1.0
mixup: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
imgsz: 640
  # Facoltativo. Se manca, train.imgsz.
cache: disk
  # ram | disk | false. Dove tenere in cache le immagini. Fuori dal finetune_key.
pretrained: true
  # true | false. Il fine-tuning parte dai pesi ereditati dal pruned.pt della ricerca: va lasciato true.
scale: 0.5
  # Intervallo di scala casuale dell'immagine: fattore tra 1-scale e 1+scale (0 = nessun ridimensionamento).

flipud: 0.0
  # Probabilita' di capovolgimento verticale.
shear: 0.0
  # Taglio (shear) casuale massimo, in gradi.
perspective: 0.0
  # Distorsione prospettica casuale (0-0.001).
bgr: 0.0
  # Probabilita' di scambiare i canali RGB in BGR.
cutmix: 0.0
  # Probabilita' di CutMix: incolla una zona di un'altra immagine con i suoi box.
augmentations: []
  # Lista di trasformazioni Albumentations nel formato A.to_dict ({transform: {__class_fullname__: ..., p: ...}}).
  # Sostituisce la lista di default di Ultralytics (Blur, MedianBlur, ToGray, CLAHE). Qui: degrado della camera.
translate: 0.1
  # Traslazione casuale, frazione della dimensione dell'immagine.
degrees: 0.0
  # Rotazione casuale massima, in gradi.
fliplr: 0.5
  # Probabilita' di specchiatura orizzontale.
reinit: false
  # true: reinizializza i pesi della rete potata prima di allenarla (train from scratch dell'architettura
  # trovata). Lo legge lo stage, non va a Ultralytics. Preset: finetune=scratch (ricetta di train/default).
