# Riferimento dei campi di conf/stage/<nome>.yaml
#
# Lo stadio decide cosa fa run.py. I campi sotto `name` valgono solo per
# alcuni stadi, come indicato.

name: benchmark
  # OBBLIGATORIO. Valori: train | search | finetune | export | benchmark | provision
  #   train     -> allena e mette i pesi in artifacts/weights/
  #   roofline  -> misura i tetti del roofline model (picco di calcolo, banda):
  #                results/roofline/, usati da tools.roofline
  #   (i file probe_edge.yaml e roofline_edge.yaml sono preset per le board lente, con
  #   name: probe / name: roofline)
  #   probe     -> misura con reti dummy quale N (canali a blocchi) premia la board:
  #                results/probe/, usato dalle strategie con pit.n: auto
  #   search    -> solo strategie pit: ricerca PIT, modello potato in artifacts/search/
  #   finetune  -> solo strategie pit: fine-tuning del potato in artifacts/finetune/
  #   export    -> esporta (e quantizza) in artifacts/exports/
  #   benchmark -> misura, e scrive un JSON per cella in results/
  #   provision -> prepara la board e verifica che sia usabile

force: false
  # Solo stage=provision. true | false (default: false).
  # true -> ignora la sentinella .env_hash e riprovisiona comunque.
proxy: auto
  # Solo stage=provision. auto | null | URL. Proxy scritto sulla board prima del controllo
  # internet: /etc/environment (pip, python, curl, git), /etc/apt/apt.conf.d/95proxy (apt),
  # drop-in systemd del demone docker (docker pull, riavvia docker se cambia) e
  # ~/.docker/config.json dell'utente di misura (docker build). auto: https_proxy /
  # http_proxy di questo PC, niente se non c'e'. null: la board non viene toccata.
no_proxy: [localhost, 127.0.0.1, 10.42.0.0/24]
  # Solo stage=provision con proxy. Indirizzi che non passano dal proxy; 10.42.0.0/24 e' la
  # rete condivisa da NetworkManager fra PC e board.
internet_check: [https://pypi.org/simple/pip/]
  # Solo stage=provision. Lista di URL provati dalla board (python3, rispetta http(s)_proxy)
  # prima dello script di provisioning, solo quando lo script deve girare: se uno non
  # risponde entro 15 s, errore e provisioning non avviato. [] per saltare il controllo.
bootstrap: null
  # Solo stage=provision. null | user@host. Primo accesso a una board nuova tramite un utente
  # che ha gia' sudo (es. admin@pi.local): crea bootstrap_user senza password, gli da' sudo
  # senza password (e il gruppo docker, se c'e'), copia la chiave SSH di questo PC (creata se
  # manca) e aggiunge l'alias remote.host a ~/.ssh/config. Idempotente. Da terminale: la
  # password di admin, se serve, la chiede ssh.
bootstrap_user: bench
  # Solo stage=provision con bootstrap. L'utente di misura: il workdir della board deve stare
  # nella sua home.

# --- solo stage=benchmark, stage=probe e stage=roofline ---------------------

thermal:
  # Cooldown condizionale prima di ogni cella: se la board e' gia' sotto
  # soglia non aspetta niente.
  threshold_c: 45
    # Float. Temperatura sotto la quale si parte. Se la board non ha sensori
    # leggibili, l'attesa viene saltata.
  timeout_s: 300
    # Intero. Oltre questo tempo si procede comunque, con un warning: la cella
    # resta utilizzabile perche' temp_start_c e order_index finiscono nel
    # risultato e in analisi si vede se il termico stava sporcando le misure.
  poll_s: 10
    # Intero. Ogni quanto rileggere la temperatura.

scheduling:
  rt_priority: 80
    # Intero 1-99, oppure null per disattivare. Diventa `chrt -f <n>` davanti
    # al comando di misura e riduce il jitter. Richiede CAP_SYS_NICE: se non
    # c'e', la misura viene fatta lo stesso e il risultato riporta
    # rt_scheduling: false. Non viene applicato ai comandi che passano dal
    # container, dove finirebbe sul client docker invece che sul processo.
  drop_caches: true
    # true | false. Svuota la page cache prima di ogni cella, cosi' il primo
    # caricamento del modello e' confrontabile fra celle.
  swap_off: true
    # true | false. Disattiva lo swap per la durata della cella e lo rimette
    # com'era dopo. Meglio un OOM visibile che una cella in swap.

# --- solo stage=probe -------------------------------------------------------

iters: 100
  # Solo probe e roofline. Intero. Iterazioni del tool di misura per ogni rete dummy
  # (sostituisce backend.benchmark.iters).
warmup_iters: 10
  # Solo probe e roofline. Intero. Solo per i backend con warmup configurabile.

plot: true
  # true | false. Un PNG per probe: latenza e throughput in funzione di C, con le linee ai
  # multipli dell'N trovato.
plot_xtick: 4
  # Intero. Tacche dell'asse x del grafico ogni tanti canali (default 4).

sweep:
  # Reti dummy: L blocchi (conv o lineari) + SiLU + residual, tutti a C canali (o neuroni).
  # Per ogni forma si misura la latenza per C da c_min a c_max. Efficienza = MAC / latenza.
  # Un C e' "allineato" se la sua efficienza e' entro `tolerance` dalla migliore vista nei
  # `window` canali precedenti. N = il piu' piccolo fra 1, 2, 4, ... i cui multipli sono
  # allineati (tranne al piu' una frazione max_violations). N globale = il piu' grande fra
  # le forme con in_global: true (i suoi multipli sono multipli anche degli altri).
  c_min: 32
    # Intero. Il range deve contenere almeno due multipli dell'N piu' grande da provare.
  c_max: 128
  c_step: 1
    # Intero. 1: con passi piu' grandi si perdono i C non allineati che fanno da confronto.
  repeats: 3
    # Intero. Passate complete, ognuna in ordine casuale; per ogni C si usa la mediana. La
    # dispersione fra le passate stima il rumore.
  n_candidates: null
    # null -> 1, 2, 4, ... finche' ci sono almeno due multipli nel range; oppure [8, 16].
  tolerance: 0.1
    # Float. Si usa il massimo fra questo e il rumore stimato.
  window: 32
    # Intero. Quanti canali indietro guardare per l'efficienza migliore.
  max_violations: 0.2
    # Float 0-1. Frazione di multipli non allineati tollerata (una misura sporca isolata non
    # boccia un N).
  seed: 0
    # Intero. Ordine casuale delle misure: la deriva termica non sembra un effetto di C.
  shapes:
    # Lista di forme. Ognuna:
    #   kind      conv | linear (default conv)
    #   kernel    intero, solo conv
    #   hw        conv: lato della feature map; linear: righe dell'input (token o batch)
    #   depthwise true | false, solo conv
    #   layers    numero di blocchi
    #   in_global true | false (default true): se false la forma e' solo informativa,
    #             N compare nel summary ma non entra nell'N globale
    # Per i lineari C e' il numero di neuroni del layer.
    - {kind: conv, kernel: 3, hw: 40, depthwise: false, layers: 8, in_global: true}
    - {kind: linear, hw: 400, layers: 8, in_global: false}

# --- solo stage=roofline ----------------------------------------------------

compute_shapes:
  # Reti dummy ad alta intensita' aritmetica; il picco di calcolo e' la migliore. Campi come
  # sweep.shapes, piu' `c` (canali o neuroni).
  - {kind: conv, kernel: 3, hw: 40, layers: 8, c: 256}
  - {kind: linear, hw: 1024, layers: 8, c: 1024}
bandwidth:
  elements: 67108864
    # Intero. Elementi fp32 del tensore moltiplicato per uno scalare (1 lettura + 1
    # scrittura): deve superare di molto le cache, altrimenti si misura la banda della cache.
