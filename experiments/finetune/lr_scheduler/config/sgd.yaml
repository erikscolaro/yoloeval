# Fine-tuning del modello potato con SGD, batch 64 e decadimento lungo del lr (lr0 -> lr0*lrf).
# I nomi coincidono con gli argomenti di model.train() di Ultralytics.
epochs: 100
batch: 64
workers: 12
optimizer: SGD
lr0: 0.01
lrf: 0.0001
cos_lr: false
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 0
patience: 100
close_mosaic: 25
seed: 42
mosaic: 1.0
mixup: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
