# Training da zero di yolo26p con MuSGD: ablation sull'optimizer (experiments/ablation/train/lr_scheduler).
# Identica a scratch_{adam,musgd,sgd}.yaml tranne optimizer e lr0; il resto come i default di
# Ultralytics. I nomi delle chiavi coincidono 1:1 con gli argomenti di model.train().
epochs: 250
batch: 64
workers: 12
cache: disk             # fuori dalle chiavi: cambia solo come si caricano i dati
imgsz: 640
optimizer: MuSGD
lr0: 0.01               # quello scelto da optimizer=auto di Ultralytics (MuSGD)
lrf: 0.01               # lr finale = lr0 * 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
patience: 250           # niente early stopping: curve complete da confrontare
close_mosaic: 10        # default di Ultralytics (scratch.yaml: 100)
seed: 42
mosaic: 1.0
mixup: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
